; Enterprise Procurement Management System - production PHP tuning
memory_limit = 512M
upload_max_filesize = 25M
post_max_size = 30M
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000
date.timezone = Asia/Manila

expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

session.gc_maxlifetime = 7200
