name: pms-procurement

x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile
  image: pms-procurement:latest
  env_file: .env
  dns:
    - 8.8.8.8
    - 8.8.4.4
  depends_on:
    mysql:
      condition: service_healthy
  volumes:
    - storage-data:/var/www/html/storage/app
    - ./storage/logs:/var/www/html/storage/logs
    - app-public:/var/www/html/public
  networks: [pms]

services:
  app:
    <<: *app-image
    container_name: pms-app
    environment:
      CONTAINER_ROLE: app
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: pms-nginx
    depends_on: [app]
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app-public:/var/www/html/public:ro
    networks: [pms]
    restart: unless-stopped

  queue:
    <<: *app-image
    container_name: pms-queue
    environment:
      CONTAINER_ROLE: queue
    restart: unless-stopped

  scheduler:
    <<: *app-image
    container_name: pms-scheduler
    environment:
      CONTAINER_ROLE: scheduler
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: pms-mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-pms_procurement}
      MYSQL_USER: ${DB_USERNAME:-pms_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [pms]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pms-redis
    volumes:
      - redis-data:/data
    networks: [pms]
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: pms-mailhog
    ports:
      - "8025:8025" # web UI to inspect NOA/NTP/CAF/PhilGEPS notification emails
    networks: [pms]
    restart: unless-stopped

networks:
  pms:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  storage-data:
  app-public:
